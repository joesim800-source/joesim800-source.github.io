<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆豆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
body{background:#f8f5f0;padding:16px;color:#222;}
.header-card{background:#147048;color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.logo-box{background:#ffffff;border-radius:14px;padding:6px;width:84px;height:64px;display:flex;align-items:center;justify-content:center;}
.logo-box svg{width:100%;height:100%;}
.logo-text-main{font-size:26px;font-weight:700;color:#222;margin-right:8px;}
.logo-text-side{font-size:26px;font-weight:700;color:#ffffff;}
.lang-select{background:rgba(255,255,255,0.22);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-size:16px;}
.download-btn{width:100%;padding:15px;background:#fff;color:#147048;border:none;border-radius:14px;font-size:17px;font-weight:500;margin-top:14px;}
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;}
.mode-card{background:#fff;border-radius:16px;padding:20px;text-align:center;border:1px solid #eee;}
.mode-card.active{background:#147048;color:#fff;}
.mode-card .title{font-size:19px;font-weight:bold;margin-bottom:5px;}
.mode-card .desc{font-size:14px;opacity:0.85;}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:18px;}
.tab{padding:11px 18px;background:#ddd;border-radius:12px;font-size:16px;white-space:nowrap;}
.tab.active{background:#147048;color:#fff;}
.panel-card{background:#fff;border-radius:18px;padding:20px;}
.status-text{background:#eee;padding:14px;border-radius:12px;margin:16px 0;color:#444;font-size:15px;}
.radio-row{display:flex;gap:24px;margin:14px 0;font-size:16px;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
button{padding:16px;border:none;border-radius:14px;font-size:16px;}
.btn-red{background:#e6392e;color:#fff;font-weight:500;}
.btn-green{background:#147048;color:#fff;font-weight:500;}
.btn-gray{background:#f0f3f1;color:#147048;}
</style>
</head>
<body>
<div class="header-card">
<div class="logo-row">
<div class="logo-box">
<svg viewBox="0 0 100 70">
  <path d="M12 35 C12 12, 40 8, 62 22 C82 34, 78 58, 55 62 C30 66, 12 55,12 35 Z" fill="#147048"/>
  <path d="M18 28 C32 18, 54 20, 68 32" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
</svg>
</div>
<span class="logo-text-main">豆豆</span>
<span class="logo-text-side">豆豆</span>
</div>
<select class="lang-select">
<option value="zh">🇨🇳 zh</option>
<option value="en">🇬🇧 en</option>
<option value="ms">🇲🇾 ms</option>
</select>
<button class="download-btn" onclick="downloadHtml()">💾 下载本面板（存到手机）</button>
</div>

<div class="mode-row">
<div class="mode-card active">
<div class="title">🔥 互热</div>
<div class="desc">自有素材池，慢慢养对话</div>
</div>
<div class="mode-card">
<div class="title">📥 群发</div>
<div class="desc">发给导入名单里的大批顾客</div>
</div>
</div>

<div class="tabs">
<div class="tab active">账号</div>
<div class="tab">模板</div>
<div class="tab">名单</div>
<div class="tab">设置</div>
<div class="tab">报表</div>
</div>

<div class="panel-card">
<h3>📱 WhatsApp 账号登记</h3>
<p style="font-size:15px;color:#555;margin:10px 0;">对接本地 Baileys (WhatsApp Web) 服务；互热与群发共用这一条连接。</p>
<div class="status-text">本地服务未启动：请先运行 Baileys 服务，再回到本页刷新。</div>
<div class="radio-row">
<label><input type="radio" name="loginType" checked> 扫码登录</label>
<label><input type="radio" name="loginType"> 手机号 + 配对码</label>
</div>
<div class="btn-row">
<button class="btn-gray">连接 / 刷新配对</button>
<button class="btn-gray">断开登录</button>
</div>
<div class="status-text">本地服务未启动：请先运行 Baileys 服务，再回到本页刷新。</div>
<div class="btn-row" style="margin-top:26px;">
<button class="btn-red">■ 停止</button>
<button class="btn-green">▶ 启动互热</button>
</div>
</div>

<script>
const API_URL = "http://127.0.0.1:8080";
function downloadHtml(){
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html],{type:"text/html"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "doudou.html";
  a.click();
}
</script>
</body>
</html>
