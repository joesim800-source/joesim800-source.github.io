<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆豆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#f8f8f8;padding:16px;color:#222;}
.header-card{background:#156b48;color:#fff;border-radius:18px;padding:20px;position:relative;overflow:hidden;}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.logo-box{width:70px;height:70px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#156b48;}
.logo-text{font-size:28px;font-weight:bold;}
.lang-select{background:#fff;color:#156b48;border:none;border-radius:8px;padding:8px 10px;font-size:16px;}
.download-btn{width:100%;padding:14px;background:#fff;color:#156b48;border:none;border-radius:12px;font-size:17px;font-weight:500;margin-top:12px;}
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;}
.mode-card{background:#fff;border-radius:14px;padding:18px;text-align:center;border:1px solid #eee;}
.mode-card.active{background:#156b48;color:#fff;}
.mode-card .title{font-size:18px;font-weight:bold;margin-bottom:4px;}
.mode-card .desc{font-size:13px;opacity:0.8;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;}
.tab{padding:10px 16px;background:#ddd;border-radius:10px;font-size:15px;white-space:nowrap;}
.tab.active{background:#156b48;color:#fff;}
.panel-card{background:#fff;border-radius:14px;padding:18px;}
.status-text{background:#eee;padding:12px;border-radius:10px;margin:14px 0;color:#444;}
.radio-row{display:flex;gap:20px;margin:12px 0;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
button{padding:14px;border:none;border-radius:12px;font-size:16px;}
.btn-red{background:#dd3333;color:#fff;}
.btn-green{background:#156b48;color:#fff;}
.btn-gray{background:#e9e9e9;color:#444;}
</style>
</head>
<body>
<div class="header-card">
<div class="logo-row">
<div class="logo-box">豆</div>
<div class="logo-text">豆豆</div>
</div>
<select class="lang-select">
<option value="zh">🇨🇳 zh</option>
<option value="en">🇬🇧 en</option>
<option value="ms">🇲🇾 ms</option>
</select>
<button class="download-btn">💾 下载本面板（存到手机）</button>
</div>

<div class="mode-row">
<div class="mode-card active">
<div class="title">🔥 互热</div>
<div class="desc">自有素材池，慢慢养对话</div>
</div>
<div class="mode-card">
<div class="title">📥 群发</div>
<div class="desc">发给导入名单里的大批顾客</div>
</div>
</div>

<div class="tabs">
<div class="tab active">账号</div>
<div class="tab">模板</div>
<div class="tab">名单</div>
<div class="tab">设置</div>
<div class="tab">报表</div>
</div>

<div class="panel-card">
<h3>📱 WhatsApp 账号登记</h3>
<p style="font-size:14px;color:#555;margin:8px 0;">对接本地 Baileys (WhatsApp Web) 服务；互热与群发共用这一条连接。</p>
<div class="status-text">本地服务未启动：请先运行 Baileys 服务，再回到本页刷新。</div>
<div class="radio-row">
<label><input type="radio" name="loginType" checked> 扫码登录</label>
<label><input type="radio" name="loginType"> 手机号 + 配对码</label>
</div>
<div class="btn-row">
<button class="btn-gray">连接 / 刷新配对</button>
<button class="btn-gray">断开登录</button>
</div>
<div class="status-text">本地服务未启动：请先运行 Baileys 服务，再回到本页刷新。</div>
<div class="btn-row" style="margin-top:24px;">
<button class="btn-red">■ 停止</button>
<button class="btn-green">▶ 启动互热</button>
</div>
</div>

<script>
// 本地服务地址，Baileys 服务跑在本机
const API_URL = "http://127.0.0.1:8080";
</script>
</body>
</html>
