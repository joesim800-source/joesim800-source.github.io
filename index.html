<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doudou WhatsApp Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:20px;background:#f5f7fa}
.box{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
button{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;margin:6px 0;cursor:pointer}
.btn-green{background:#22c55e;color:white}
.btn-blue{background:#3b82f6;color:white}
.btn-orange{background:#f97316;color:white}
.btn-gray{background:#9ca3af;color:white}
.status{padding:10px;border-radius:8px;background:#eee;margin:8px 0}
</style>
</head>
<body>
<h2>Doudou 控制面板</h2>
<div class="box">
  <div class="status" id="status">等待连接 AutoJS</div>
  <button class="btn-green" onclick="sendCmd('start')">开始群发</button>
  <button class="btn-orange" onclick="sendCmd('stop')">停止任务</button>
  <button class="btn-blue" onclick="sendCmd('toggleMode')">切换无障碍开关</button>
  <button class="btn-gray" onclick="sendCmd('toggleVoice')">语音控制 开/关</button>
</div>
<script>
const host = "http://127.0.0.1:9000";
async function sendCmd(cmd){
  try{
    const res = await fetch(host+"/cmd?action="+cmd);
    const txt = await res.text();
    document.getElementById("status").innerText = "返回："+txt;
  }catch(e){
    document.getElementById("status").innerText = "连接失败，请先运行AutoJS脚本";
  }
}
</script>
</body>
</html>
